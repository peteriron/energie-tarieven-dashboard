name: Prijzen ophalen en publiceren

on:
  push:
    branches: [main]
  schedule:
    # elk half uur; day-ahead-prijzen voor morgen verschijnen rond 13u Belgische tijd
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: EPEX SPOT BE day-ahead prijzen ophalen
        run: node scripts/fetch-prices.mjs 90
      - name: Site samenstellen
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css tariffs.js _site/
          cp data/prices.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
